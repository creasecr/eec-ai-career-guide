<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EEC AI Career Pathway Guide</title>
    <meta
      name="description"
      content="Conversational AI guide that recommends Energy Education Center courses and builds a beginner to advanced learning pathway."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation" focusable="false">
              <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">Energy Education Center</span>
            <span class="brand-subtitle">AI Career Pathway Guide</span>
          </span>
        </div>
        <button type="button" class="ghost-button" id="restart-button">Start over</button>
      </header>

      <main class="chat" id="chat" aria-live="polite" aria-label="Career guide conversation">
        <div class="chat-scroll" id="chat-scroll">
          <ol class="messages" id="messages"></ol>
        </div>
      </main>

      <footer class="composer">
        <div class="quick-replies" id="quick-replies" aria-label="Suggested answers"></div>
        <form class="composer-form" id="composer-form" autocomplete="off">
          <label class="sr-only" for="composer-input">Message the career guide</label>
          <textarea
            id="composer-input"
            name="message"
            rows="1"
            placeholder="Type your answer&hellip;"
          ></textarea>
          <button type="submit" class="send-button" id="send-button" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z" />
            </svg>
          </button>
        </form>
        <p class="disclaimer">
          Recommendations are generated from the EEC course catalog. Contact an advisor to confirm
          prerequisites and schedules.
        </p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
